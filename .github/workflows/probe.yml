name: Toolchain probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\.github\scripts\Install-Toolchain.ps1
      - shell: cmd
        run: |
          set VCVARS="%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat"
          for %%A in ("x64_arm 10.0.18362.0 -vcvars_ver=14.16" "x64_arm store 10.0.18362.0 -vcvars_ver=14.16" "x86_arm store 10.0.18362.0 -vcvars_ver=14.16" "x64_arm store -vcvars_ver=14.16.27023" "x64_arm uwp 10.0.18362.0 -vcvars_ver=14.16") do (
            echo ===== %%~A
            cmd /c "set VSCMD_DEBUG=1 && call %VCVARS% %%~A > out.txt 2>&1 & echo exit=!errorlevel!" 
            findstr /i "error ERROR: exit warning" out.txt
          )
          dir "%VS_PATH%\VC\Tools\MSVC\14.16.27023\lib\arm"
          dir "%VS_PATH%\VC\Tools\MSVC\14.16.27023\bin"
          dir "%VS_PATH%\VC\Tools\MSVC"
      - shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -prerelease -format json | ConvertFrom-Json | Select installationPath, installationVersion
          $cat = Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages\_Instances\*\catalog.json" | Select -First 1
          (Get-Content $cat -Raw | ConvertFrom-Json).packages | Where-Object { $_.id -match 'v141' } | ForEach-Object { $_.id } | Sort-Object -Unique
